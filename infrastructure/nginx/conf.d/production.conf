# Status page (status.markcheli.com — Uptime Kuma, public)
# Status page deliberately public so it works when LAN is down.
# Uptime Kuma's WebSocket needs proxy_http_version 1.1 + Upgrade headers.
# Uses a publicly-trusted Let's Encrypt cert (rather than the CF Origin
# wildcard) so LAN clients whose DNS resolves to the origin IP directly
# also see a trusted cert. Renewed via scripts/renew-letsencrypt-certs.sh.
server {
    listen 443 ssl;
    if ($reject_br_body) { return 415; }  # CVE-2026-111497, see map at top
    http2 on;
    server_name status.markcheli.com;

    ssl_certificate /etc/nginx/certs/letsencrypt-status.crt;
    ssl_certificate_key /etc/nginx/certs/letsencrypt-status.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    # Bare URL redirects to the public status page. Admin can still reach
    # /dashboard, /add, /settings, etc. — those paths pass through normally
    # because this is a `location =` exact match on /.
    location = / {
        return 302 /status/homelab;
    }

    location / {
        set $kuma_backend http://uptime-kuma:3001;
        proxy_pass $kuma_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

# Push notifications (ntfy.markcheli.com — ntfy, public via Cloudflare)
# Public so phones can subscribe from anywhere; ntfy itself is deny-all, so
# only token/password holders can publish or read. Subscriptions are
# long-lived HTTP/WebSocket streams: no buffering, timeouts above ntfy's 45s
# keepalive.
server {
    listen 443 ssl;
    if ($reject_br_body) { return 415; }  # CVE-2026-111497, see map at top
    http2 on;
    server_name ntfy.markcheli.com;

    ssl_certificate /etc/nginx/certs/wildcard-markcheli.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard-markcheli.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    location / {
        limit_req zone=api burst=50 nodelay;

        set $ntfy_backend http://ntfy:80;
        proxy_pass $ntfy_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3m;
        proxy_send_timeout 3m;
        proxy_read_timeout 3m;
    }
}

