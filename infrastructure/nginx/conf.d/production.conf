# Production NGINX Configuration for 83RR PowerEdge Infrastructure
# Currently running services only

# Docker internal DNS resolver - ensures container IPs are re-resolved
# after Watchtower restarts containers with new IPs
resolver 127.0.0.11 valid=10s;

# Upstream definitions
upstream flask_api {
    server flask-api:5000;
}

upstream personal_website {
    server personal-website:3000;
}

upstream opensearch_dashboards {
    server opensearch-dashboards:5601;
}

upstream grafana {
    server grafana:3000;
}

upstream prometheus {
    server prometheus:9090;
}

upstream cadvisor {
    server cadvisor:8080;
}

upstream cookbook {
    server cookbook:80;
}

upstream homeassistant {
    server 192.168.1.121:8123;
}

upstream seafile {
    server seafile:80;
}

upstream plex {
    server plex:32400;
}

upstream tallied {
    server tallied:8000;
}

upstream tasks {
    server tasks:8000;
}

upstream openclaw {
    # OpenClaw is on a dedicated proxy-only network (nginx-openclaw)
    # NOT on the main infrastructure network — fully isolated from other services
    server openclaw:18789;
}

# CVE-2026-111497 ("HTTP2Shell", Brotli decoder OOB write) interim mitigation:
# refuse Brotli-encoded request bodies before they reach a backend that
# might decode them (Node/Express body-parser, Python with brotli installed).
# Browsers never send Content-Encoding: br on requests, so nothing
# legitimate is blocked. Keep until every backend runtime is patched.
map $http_content_encoding $reject_br_body {
    default 0;
    "~*(^|[\s,])br([\s,;]|$)" 1;
}

# WebSocket upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ═════════════════════════════════════════════════════════════════════════════
# HTTP to HTTPS Redirect (All domains)
# ═════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name
        www.markcheli.com
        markcheli.com
        flask.markcheli.com
        cookbook.markcheli.com
        home.markcheli.com
        videos.markcheli.com
        files.markcheli.com
        money.markcheli.com
        money-demo.markcheli.com
        tasks.markcheli.com
        tasks-demo.markcheli.com
        status.markcheli.com
        ntfy.markcheli.com
        logs.ops.markcheli.com
        opensearch.ops.markcheli.com
        dashboard.ops.markcheli.com
        prometheus.ops.markcheli.com
        cadvisor.ops.markcheli.com
        report.ops.markcheli.com
        energy.ops.markcheli.com
        deptrack.ops.markcheli.com;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # NGINX metrics for prometheus (internal only)
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 172.16.0.0/12;  # Docker networks
        allow 192.168.0.0/16; # Local networks
        allow 10.0.0.0/8;     # Private networks
        deny all;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ═════════════════════════════════════════════════════════════════════════════
