# Dependency-Track (deptrack.ops.markcheli.com — LAN-only)
# / is the frontend SPA, /api the apiserver. DT has its own login, so no
# basic auth (it would also break the SPA's API calls). The nightly
# scripts/sbom-scan.sh talks to the apiserver container directly, not via here.
# variable-based proxy_pass so nginx still starts when DT is down.
server {
    listen 443 ssl;
    if ($reject_br_body) { return 415; }  # CVE-2026-111497, see map at top
    http2 on;
    server_name deptrack.ops.markcheli.com;

    ssl_certificate /etc/nginx/certs/letsencrypt-ops-markcheli.crt;
    ssl_certificate_key /etc/nginx/certs/letsencrypt-ops-markcheli.key;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # LAN-only access
    allow 192.168.1.0/24;
    deny all;

    # BOM uploads from the UI (DT's own limit is 100 MB decompressed)
    client_max_body_size 100m;

    location /api/ {
        set $deptrack_api_backend http://deptrack-apiserver:8080;
        proxy_pass $deptrack_api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        set $deptrack_frontend_backend http://deptrack-frontend:8080;
        proxy_pass $deptrack_frontend_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Default HTTPS - catch-all for undefined domains
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/wildcard-markcheli.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard-markcheli.key;

    return 404;
}
