# Seafile (files.markcheli.com)
server {
    listen 443 ssl;
    if ($reject_br_body) { return 415; }  # CVE-2026-111497, see map at top
    http2 on;
    server_name files.markcheli.com;

    ssl_certificate /etc/nginx/certs/wildcard-markcheli.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard-markcheli.key;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 0;  # Unlimited file uploads

    # Seafile fileserver for uploads/downloads. The image's bundled nginx fronts
    # every component on :80 and strips /seafhttp itself (the supported 12.0+
    # layout), so we no longer reach into the container's 8082.
    location /seafhttp {
        proxy_pass http://seafile;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 1200s;
        proxy_request_buffering off;

        client_max_body_size 0;
    }

    # Notification server for real-time sync (its own container since 12.0).
    # Variable proxy_pass so nginx still starts if that container is down. The
    # rewrites strip /notification: the server only serves / (websocket) and
    # /ping, so forwarding the path 404s.
    location /notification/ping {
        set $seafile_notification_backend http://seafile-notification:8083;
        rewrite ^ /ping break;
        proxy_pass $seafile_notification_backend;
        access_log off;
    }

    location /notification {
        set $seafile_notification_backend http://seafile-notification:8083;
        rewrite ^/notification/?(.*)$ /$1 break;
        proxy_pass $seafile_notification_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://seafile;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 1200s;
        proxy_connect_timeout 1200s;

        # WebSocket for sync
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ═════════════════════════════════════════════════════════════════════════════
# LAN-ONLY SERVICES (*.ops.markcheli.com)
# ═════════════════════════════════════════════════════════════════════════════

# NOTE: every *.ops vhost shares the public :443 listener, so "LAN-only" is
# enforced HERE (allow/deny) — not by DNS. Anyone can send
# `Host: <x>.ops.markcheli.com` to the public IP. Keep allow/deny on every
# block below (2026-10-18 sweep: Grafana was internet-reachable this way).

# OpenSearch Dashboards (logs.ops.markcheli.com)
server {
    listen 443 ssl;
    if ($reject_br_body) { return 415; }  # CVE-2026-111497, see map at top
    http2 on;
    server_name logs.ops.markcheli.com;

    ssl_certificate /etc/nginx/certs/letsencrypt-ops-markcheli.crt;
    ssl_certificate_key /etc/nginx/certs/letsencrypt-ops-markcheli.key;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # LAN-only access, plus basic auth
    allow 192.168.1.0/24;
    deny all;
    auth_basic "Ops Services";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://opensearch_dashboards;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

