# Durable fix for the 2026-05-17 hard-reboot race:
# /storage is /dev/md0 (mdraid, fstab `nofail`). After a hard reboot the
# array assembles slowly and Docker would start containers before /storage
# was mounted, so seafile/plex/fluent-bit bind-mounted onto an empty
# directory (Seafile then crash-looped with an ELOOP nginx symlink).
#
# RequiresMountsFor pulls in the .mount unit for /storage and orders
# docker.service strictly after it, so dockerd never starts until the
# RAID array is mounted.
#
# Install:
#   sudo install -D -m644 infrastructure/systemd/docker-wait-storage.conf \
#       /etc/systemd/system/docker.service.d/wait-storage.conf
#   sudo systemctl daemon-reload
#   systemctl show docker.service -p After -p RequiresMountsFor | grep -i storage   # verify
[Unit]
RequiresMountsFor=/storage
After=storage.mount
