# 83rr-poweredge: fail2ban filter for the tallied-db Postgres auth failures.
# Installed as /etc/fail2ban/filter.d/postgresql-tallied.conf by install.sh.
#
# Reads /var/log/pg-auth/tallied-db.log, which Fluent Bit fills with the
# tallied-db FATAL auth lines only (log_line_prefix "%m [%p] host=%h user=%u db=%d "):
#   2026-11-25 15:00:00.123 UTC [123] host=203.0.113.7 user=postgres db=postgres FATAL:  no pg_hba.conf entry for host "203.0.113.7", user "postgres", database "postgres", no encryption
#   2026-11-25 15:00:00.456 UTC [124] host=203.0.113.7 user=tld_x db=tallied FATAL:  password authentication failed for user "tld_x"
#
# The host comes from the prefix, right after the pid, and the regex is
# anchored there: a client can put anything in its user or database name, so
# an unanchored match could be steered onto someone else's address.
# A wrong password with libpq's default sslmode=prefer logs two lines (the
# SSL try fails the password, the plain retry has no pg_hba entry).

[Definition]

failregex = ^\s*\[\d+\] host=<HOST> user=.* db=.* FATAL:\s+(?:password authentication failed for user|no pg_hba\.conf entry for host|pg_hba\.conf rejects connection for host)

# Same addresses as the jail's ignoreip, so fail2ban-regex shows them as
# ignored too: loopback, Docker, Mark's LAN, socket connections.
ignoreregex = ^\s*\[\d+\] host=(?:\[local\]|127\.|::1 |10\.|192\.168\.1\.|172\.(?:1[6-9]|2\d|3[01])\.)

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S(?:\.%%f)? %%Z
