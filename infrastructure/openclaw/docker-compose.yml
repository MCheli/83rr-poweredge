# OpenClaw — High-Security Isolated Deployment
# Fully isolated from main infrastructure network
# No Docker socket access, no access to other containers
# NGINX reaches OpenClaw via a dedicated proxy-only network (no other containers)

services:
  openclaw:
    # Pinned by digest 2026-05-17 (was :latest) — 3rd-party agent runtime
    # with access to credentials/agent state; do not auto-update. Bump
    # deliberately after reviewing upstream release notes.
    # 2026.10.9 / Node 24.22.1 (bumped 2026-10-31 from 2026.4.11 / Node
    # 24.14.0 for CVE-2026-111497, Brotli decoder).
    # Upgrade gotcha: OpenClaw won't skip versions. To jump from anything
    # older than 2026.9.7, first back up ./openclaw-home, then run the
    # 2026.9.7 image's `doctor --fix` against that state, and only then
    # start the new digest.
    image: ghcr.io/openclaw/openclaw@sha256:1a2a3ce113e435039dbeac5ae261759bb4759908563d91c81059e896b38c5d98
    container_name: openclaw
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=America/New_York
      - NODE_ENV=production
    volumes:
      # Single mount for all OpenClaw state — avoids root-owned parent dir issue
      # when mounting individual sub-paths into /home/node/.openclaw/
      - ./openclaw-home:/home/node/.openclaw:rw
      # Gmail OAuth credentials (gog CLI)
      - ./gogcli:/home/node/.config/gogcli:rw
    networks:
      - openclaw-net
      - nginx-openclaw
    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  openclaw-net:
    driver: bridge
    # Internet egress for Discord/Gmail/Anthropic
    internal: false
  nginx-openclaw:
    # Dedicated NGINX↔OpenClaw proxy network — no other containers
    # NGINX joins this via the main docker-compose.yml
    driver: bridge
    internal: true
