# /etc/nut/upsd.conf — managed by 83rr-poweredge infrastructure/nut/install.sh
# The NUT data server answers on loopback (the local upsmon) and on the LAN
# address, for the Synology NAS (MarksNAS, 192.168.1.201) in DSM's
# "Synology UPS server" mode. ufw admits TCP 3493 from the NAS's IP only
# (install.sh adds the rule). nut-server waits for network-online.target
# (drop-in nut-server-network-online.conf) so this address exists at boot.
#
# Install (with the rest of infrastructure/nut/):
#   sudo infrastructure/nut/install.sh
LISTEN 127.0.0.1 3493
LISTEN ::1 3493
LISTEN 192.168.1.179 3493
