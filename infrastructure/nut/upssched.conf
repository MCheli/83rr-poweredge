# /etc/nut/upssched.conf — managed by 83rr-poweredge infrastructure/nut/install.sh
# Timers and notices for upsmon events.
# upssched runs as the nut user; /run/nut is 0770 root:nut (created by the
# nut-common tmpfiles rule), so the pipe and lock files can live there.
#
# Install (with the rest of infrastructure/nut/):
#   sudo infrastructure/nut/install.sh
CMDSCRIPT /etc/nut/upssched-cmd
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock

# 5 minutes on battery -> clean shutdown (the UPS carried the R630 ~14 min on
# 2026-11-17). Mains back before then cancels it. LOWBATT is the backstop:
# upsmon shuts down on OB+LB by itself, without this timer.
AT ONBATT * START-TIMER onbatt-shutdown 300
AT ONBATT * EXECUTE onbatt
AT ONLINE * CANCEL-TIMER onbatt-shutdown
AT ONLINE * EXECUTE online

AT LOWBATT  * EXECUTE lowbatt
AT FSD      * EXECUTE fsd
AT COMMBAD  * EXECUTE commbad
AT COMMOK   * EXECUTE commok
AT NOCOMM   * EXECUTE nocomm
AT REPLBATT * EXECUTE replbatt
AT SHUTDOWN * EXECUTE shutdown
