# /etc/systemd/system/nut-server.service.d/83rr-network-online.conf
# managed by 83rr-poweredge infrastructure/nut/install.sh
# upsd also LISTENs on 192.168.1.179 (for the Synology NAS). network.target
# alone does not wait for the DHCP address, and upsd skips an address it
# cannot bind, so start it once the network is online.
[Unit]
Wants=network-online.target
After=network-online.target
