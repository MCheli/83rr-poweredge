# /etc/nut/nut.conf — Network UPS Tools mode for 83rr-poweredge.
# netserver: the UPS, its driver, upsd and upsmon (primary) live on this host,
# and upsd also serves the Synology NAS (MarksNAS) as a network client
# (secondary) on 192.168.1.179:3493, see upsd.conf and upsd.users.template.
#
# Install (with the rest of infrastructure/nut/):
#   sudo infrastructure/nut/install.sh
MODE=netserver
