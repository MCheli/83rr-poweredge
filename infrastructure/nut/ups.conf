# /etc/nut/ups.conf — the one UPS feeding the R630.
# CyberPower CP1500PFCRM2U on USB (HID, vendor id 0764, usually product 0601).
# Named `ups` because DSM's "Synology UPS server" mode (the NAS, MarksNAS)
# only looks for a UPS of that name.
#
# offdelay/ondelay only matter for the kill-power command, which is OFF
# (no POWERDOWNFLAG in upsmon.conf), so they are not used today. Kept in case
# kill-power comes back: usbhid-ups(8) says many CyberPower models divide these
# by 60 and round down, so the driver defaults (20/30) would make the UPS cut
# its output almost at once. 60/120 are the minimums the man page advises:
# output off 60 s after the host halts, back on 120 s after mains returns
# (ondelay must stay greater than offdelay).
#
# Install (with the rest of infrastructure/nut/):
#   sudo infrastructure/nut/install.sh
[ups]
    driver = usbhid-ups
    port = auto
    vendorid = 0764
    offdelay = 60
    ondelay = 120
    desc = "CyberPower CP1500PFCRM2U feeding 83rr-poweredge (R630)"
