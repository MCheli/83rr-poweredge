# /etc/nut/upsmon.conf — managed by 83rr-poweredge infrastructure/nut/install.sh
# Shuts the R630 down cleanly when the UPS has been on battery for 5 minutes
# (upssched timer, see upssched.conf) or reports low battery, whichever comes
# first. install.sh replaces __UPSMON_PASSWORD__ with the password it put in
# upsd.users. Keywords checked against upsmon.conf(5) for NUT 2.8.1.
#
# Install (with the rest of infrastructure/nut/):
#   sudo infrastructure/nut/install.sh

MONITOR cp1500@localhost 1 upsmon __UPSMON_PASSWORD__ primary
MINSUPPLIES 1

SHUTDOWNCMD "/sbin/shutdown -h +0"

# Every event below goes to syslog, wall and upssched (EXEC), which runs
# /etc/nut/upssched-cmd for the ntfy pushes and the 5-minute shutdown timer.
NOTIFYCMD /usr/sbin/upssched
NOTIFYFLAG ONLINE   SYSLOG+WALL+EXEC
NOTIFYFLAG ONBATT   SYSLOG+WALL+EXEC
NOTIFYFLAG LOWBATT  SYSLOG+WALL+EXEC
NOTIFYFLAG FSD      SYSLOG+WALL+EXEC
NOTIFYFLAG COMMOK   SYSLOG+WALL+EXEC
NOTIFYFLAG COMMBAD  SYSLOG+WALL+EXEC
NOTIFYFLAG SHUTDOWN SYSLOG+WALL+EXEC
NOTIFYFLAG REPLBATT SYSLOG+WALL+EXEC
NOTIFYFLAG NOCOMM   SYSLOG+WALL+EXEC

# Present while the host shuts down for power: the systemd shutdown hook
# (nutshutdown) then tells the UPS to cut its output (after ups.conf offdelay)
# and switch back on when mains returns (after ondelay), so the R630 boots by
# itself, provided its power-restore policy is "always on" (README.md).
POWERDOWNFLAG /etc/killpower

FINALDELAY 5
# Rule of thumb from the man page: a multiple of POLLFREQ, at least 3x it.
DEADTIME 25
POLLFREQ 5
POLLFREQALERT 5
RBWARNTIME 43200
NOCOMMWARNTIME 300
