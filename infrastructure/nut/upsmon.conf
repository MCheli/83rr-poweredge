# /etc/nut/upsmon.conf — managed by 83rr-poweredge infrastructure/nut/install.sh
# Shuts the R630 down cleanly when the UPS has been on battery for 5 minutes
# (upssched timer, see upssched.conf) or reports low battery, whichever comes
# first. install.sh replaces __UPSMON_PASSWORD__ with the password it put in
# upsd.users. Keywords checked against upsmon.conf(5) for NUT 2.8.1.
#
# Install (with the rest of infrastructure/nut/):
#   sudo infrastructure/nut/install.sh

MONITOR ups@localhost 1 upsmon __UPSMON_PASSWORD__ primary
MINSUPPLIES 1

# Runs as root (sh -c). pre-shutdown.sh saves the ARK and Minecraft worlds and
# unmounts /mnt/nas (capped at 120 s, never fails, a no-op the second time:
# the 5-minute path in upssched-cmd already ran it before FSD); the shutdown
# runs whatever it returns.
SHUTDOWNCMD "/usr/bin/timeout 120 /etc/nut/pre-shutdown.sh; /sbin/shutdown -h +0"

# Every event below goes to syslog, wall and upssched (EXEC), which runs
# /etc/nut/upssched-cmd for the ntfy pushes and the 5-minute shutdown timer.
NOTIFYCMD /usr/sbin/upssched
NOTIFYFLAG ONLINE   SYSLOG+WALL+EXEC
NOTIFYFLAG ONBATT   SYSLOG+WALL+EXEC
NOTIFYFLAG LOWBATT  SYSLOG+WALL+EXEC
NOTIFYFLAG FSD      SYSLOG+WALL+EXEC
NOTIFYFLAG COMMOK   SYSLOG+WALL+EXEC
NOTIFYFLAG COMMBAD  SYSLOG+WALL+EXEC
NOTIFYFLAG SHUTDOWN SYSLOG+WALL+EXEC
NOTIFYFLAG REPLBATT SYSLOG+WALL+EXEC
NOTIFYFLAG NOCOMM   SYSLOG+WALL+EXEC

# Kill-power is OFF (2026-11-25). With POWERDOWNFLAG set, upsmon writes
# /etc/killpower and the systemd shutdown hook (nutshutdown) tells the UPS to
# cut ALL its outlets about a minute after the R630 halts, which would take the
# router and Home Assistant down ~7 minutes into an outage. Mark wants the
# UPS to keep those running as long as the battery lasts. NUT 2.8.1 has no
# built-in default for this keyword, so with it commented out upsmon never
# creates the flag and nutshutdown skips the UPS command ("Not in FSD
# (killpower) mode"). Trade-off and how to undo: README.md "Kill-power (off)".
# POWERDOWNFLAG /etc/killpower

FINALDELAY 5
# Rule of thumb from the man page: a multiple of POLLFREQ, at least 3x it.
DEADTIME 25
POLLFREQ 5
POLLFREQALERT 5
RBWARNTIME 43200
NOCOMMWARNTIME 300
