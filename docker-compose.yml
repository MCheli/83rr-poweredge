# 83RR PowerEdge Infrastructure
# Base Docker Compose configuration for all services
# Auto-loads docker-compose.override.yml for local development
# Use docker-compose.prod.yml for production deployment

# Shared logging configuration to prevent disk space issues
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The five PostgreSQL 16 databases (tallied, tallied-demo, tasks, tasks-demo,
# energy-monitor) share this pin. Minor bumps within 16.x keep the data
# directory (no dump/restore); read the "Migration to Version 16.N" section of
# the release notes first. 16.15: 2026-11-01 (was floating 16-alpine = 16.10).
x-postgres16-image: &postgres16-image postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab

services:
  # ═════════════════════════════════════════════════════════════════════════════
  # NGINX Reverse Proxy
  # ═════════════════════════════════════════════════════════════════════════════
  nginx:
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: unless-stopped
    logging: *default-logging
    environment:
      - INFRASTRUCTURE_ENV=${INFRASTRUCTURE_ENV:-production}
    ports:
      - "80:80"
      - "443:443"
      # Note: Minecraft port 25565 added in prod override (docker-compose.prod.yml)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
      # Note: nginx logs go to stdout/stderr (symlinks in Dockerfile) for Docker log capture
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - infrastructure
      - nginx-openclaw

  # ═════════════════════════════════════════════════════════════════════════════
  # Personal Website (Nuxt.js)
  # Image published from: github.com/mcheli/PersonalWebsite
  # ═════════════════════════════════════════════════════════════════════════════
  personal-website:
    image: ghcr.io/mcheli/personal-website:latest
    container_name: personal-website
    restart: unless-stopped
    logging: *default-logging
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - NODE_ENV=production
      - NUXT_PUBLIC_API_BASE=/api
      - API_URL=http://flask-api:5000
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ═════════════════════════════════════════════════════════════════════════════
  # Cookbook Website (Static Recipe Site)
  # Image published from: github.com/mcheli/cookbook
  # ═════════════════════════════════════════════════════════════════════════════
  cookbook:
    image: ghcr.io/mcheli/cookbook:latest
    container_name: cookbook
    restart: unless-stopped
    logging: *default-logging
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ═════════════════════════════════════════════════════════════════════════════
  # Flask API Service
  # Image published from: github.com/mcheli/PersonalWebsite
  # ═════════════════════════════════════════════════════════════════════════════
  flask-api:
    image: ghcr.io/mcheli/flask-api:latest
    container_name: flask-api
    restart: unless-stopped
    logging: *default-logging
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # Image's default CMD lacks gunicorn access logging — override it to
    # emit access + error logs to stdout so requests show up in OpenSearch.
    command:
      - gunicorn
      - --bind=0.0.0.0:5000
      - --workers=2
      - --timeout=30
      - --access-logfile=-
      - --error-logfile=-
      - app:app
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://user:pass@postgres:5432/dbname
      # Empty = /weather serves demo data.
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ═════════════════════════════════════════════════════════════════════════════
  # OpenSearch (Logging Infrastructure)
  # Note: Using 'latest' because data format requires matching version; pin after fresh install
  # ═════════════════════════════════════════════════════════════════════════════
  opensearch:
    # 3.2.0: the persistent data volume (opensearch_data) is OpenSearch 3.x
    # format (Lucene 10.1). 2.19.0 could not load it ("indexCreatedVersion
    # Major in the future: 10") — that downgrade pin caused the 2026-05-17
    # outage when the Docker 29 upgrade forced a restart. Keep this in lockstep
    # with opensearch-dashboards below; deploy via the prod invocation so the
    # opensearch_data volume (not the dev override's opensearch_data_local) is used.
    # 3.9.0 (2026-11-01, was 3.2.0): in-place minor upgrade, no index migration.
    # One-way: once 3.9 has written to the volume, 3.2 can't open it again, so
    # tar the volume before the bump and restore that tarball to roll back.
    image: opensearchproject/opensearch:3.9.0@sha256:3b55f6b6249cfdb92b52ee59adc8a266203ba9ef9f5d82544fad6f1af2f3609e
    container_name: opensearch
    restart: unless-stopped
    logging: *default-logging
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - infrastructure

  # ═════════════════════════════════════════════════════════════════════════════
  # OpenSearch Dashboards (Logging UI)
  # ═════════════════════════════════════════════════════════════════════════════
  opensearch-dashboards:
    # MUST match the opensearch version above.
    image: opensearchproject/opensearch-dashboards:3.9.0@sha256:256d4cea5928868ac09bca642a0ac8285a2b7e4b7fdd45c4ec06e75a5cf3184c
    container_name: opensearch-dashboards
    restart: unless-stopped
    logging: *default-logging
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
    depends_on:
      - opensearch
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q 'available'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - infrastructure

  # ═════════════════════════════════════════════════════════════════════════════
  # Fluent Bit (Log Shipper)
  # ═════════════════════════════════════════════════════════════════════════════
  fluent-bit:
    # 5.1.5 (2026-11-01, was floating 3.2 = 3.2.10). The classic-format config
    # below needed no changes for 4.x/5.x (see Fluent Bit's upgrade notes).
    image: fluent/fluent-bit:5.1.5@sha256:2740f387f6e68fab66d28e4fa6a853387b9cab6ffb4cb78958f69bba4eb0e7b4
    container_name: fluent-bit
    restart: unless-stopped
    logging: *default-logging
    user: root
    volumes:
      - ./infrastructure/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./infrastructure/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./infrastructure/fluent-bit/docker_metadata.lua:/fluent-bit/etc/docker_metadata.lua:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - fluent_bit_data:/var/log
      - plex_config:/plex-logs:ro
      - /storage/seafile/seafile/logs:/seafile-logs:ro
    depends_on:
      - opensearch
    # Note: Fluent Bit distroless image has no shell utilities for health checks
    # Service health can be verified via: docker logs fluent-bit | grep -i error
    networks:
      - infrastructure

  # ═════════════════════════════════════════════════════════════════════════════
  # Minecraft Server
  # ═════════════════════════════════════════════════════════════════════════════
  minecraft:
    # java25 rebuild of 2026-10-29 (mc-image-helper 1.75.0), pinned by digest
    # (2026-11-01). It's newer than the last release tag (2026.10.1-java25
    # @d12aed7e, the rollback), so there's no YYYY.M.P name for it yet. The
    # image upgrades Paper itself at startup (VERSION=LATEST); this pin only
    # covers the OS/JRE/tooling layer. Bump to the next YYYY.M.P-java25 release.
    image: itzg/minecraft-server:java25@sha256:f7f2222512810f0f0e85133913622cf639be77a5dd1d4b11f24ab675da6ba742
    container_name: minecraft
    restart: unless-stopped
    logging: *default-logging
    environment:
      - EULA=TRUE
      - TYPE=PAPER
      - VERSION=LATEST
      - MEMORY=2G
      - DIFFICULTY=normal
      - MOTD="83RR PowerEdge Minecraft Server"
      - ENABLE_WHITELIST=false
    volumes:
      # The live world has been in minecraft_data_local since 2026-01 (the
      # override file mounted it). minecraft_data no longer exists; mounting it
      # under the prod invocation would start a fresh, empty world.
      - minecraft_data_local:/data
    networks:
      - infrastructure

  # ═════════════════════════════════════════════════════════════════════════════
  # ARK: Survival Ascended dedicated server (Wine/Proton via mschnitzer image)
  # ═════════════════════════════════════════════════════════════════════════════
  asa:
    image: mschnitzer/asa-linux-server:1.5.1
    container_name: asa
    # On boot: render GameUserSettings.ini from template (substituting password env vars),
    # chown to the gameserver UID, then exec the upstream start_server.
    # Template is committed (no secrets); rendered file lives only in the named volume.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        dst=/home/gameserver/server-files/ShooterGame/Saved/Config/WindowsServer/GameUserSettings.ini
        mkdir -p "$$(dirname "$$dst")"
        sed -e "s|__ADMIN_PASSWORD__|$$ASA_SERVER_ADMIN_PASSWORD|g" \
            -e "s|__SERVER_PASSWORD__|$$ASA_SERVER_PASSWORD|g" \
            /opt/asa/GameUserSettings.ini.template > "$$dst"
        chown 25000:25000 "$$dst"
        exec /usr/bin/start_server
    restart: unless-stopped
    stop_grace_period: 120s
    logging: *default-logging
    environment:
      - ASA_START_PARAMS=TheIsland_WP?listen?Port=7777?RCONPort=11520?RCONEnabled=True -WinLiveMaxPlayers=20 -PublicIPForEpic=173.48.155.66
      - ENABLE_DEBUG=0
      - ASA_SERVER_ADMIN_PASSWORD=${ASA_SERVER_ADMIN_PASSWORD}
      - ASA_SERVER_PASSWORD=${ASA_SERVER_PASSWORD}
    volumes:
      - asa_server_files:/home/gameserver/server-files
      - asa_steam:/home/gameserver/steam
      - asa_steamcmd:/home/gameserver/steamcmd
      - asa_cluster_shared:/home/gameserver/cluster-shared
      - ./infrastructure/asa/config/GameUserSettings.ini.template:/opt/asa/GameUserSettings.ini.template:ro
    networks:
      - infrastructure

  # ═════════════════════════════════════════════════════════════════════════════
  # Monitoring: Prometheus (Metrics Database)
  # ═════════════════════════════════════════════════════════════════════════════
  prometheus:
    # v3.15.1 (2026-11-01, was v3.13.5 LTS): Go 1.27.3 / x/net security fixes.
    # 3.15 is not LTS, so move to 3.16.x or the next LTS when 3.15 stops getting
    # patches. XOR2 chunks stay opt-in (not enabled here), so v3.13.5
    # @aafa9d69 still reads the TSDB on rollback.
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: prometheus
    restart: unless-stopped
    logging: *default-logging
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - infrastructure

  # ═════════════════════════════════════════════════════════════════════════════
  # Monitoring: Grafana (Visualization Dashboards)
  # ═════════════════════════════════════════════════════════════════════════════
  grafana:
    # 12.4.14: fixes CVE-2026-17183 (Unified Alerting datasource authz bypass,
    # fixed in 12.4.9) plus CVE-2026-100105, -88858 and -88967 (12.4.14),
    # and the 11.x CVEs in docs/SECURITY_PLAN.md P2-2. All provisioned
    # dashboards use timeseries/stat/gauge/table panels (no Angular), so the
    # 12.x Angular removal does not affect them. Back up grafana_data first:
    # the SQLite schema migration is one-way.
    image: grafana/grafana:12.4.14
    container_name: grafana
    restart: unless-stopped
    logging: *default-logging
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - infrastructure

  # ═════════════════════════════════════════════════════════════════════════════
  # Monitoring: cAdvisor (Container Metrics)
  # ═════════════════════════════════════════════════════════════════════════════
  cadvisor:
    # Moved from gcr.io/cadvisor/cadvisor to ghcr.io/google/cadvisor at v0.53.
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    container_name: cadvisor
    restart: unless-stopped
    logging: *default-logging
    user: "0"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - infrastructure

  # ═════════════════════════════════════════════════════════════════════════════
  # Monitoring: NGINX Exporter (NGINX Metrics)
  # ═════════════════════════════════════════════════════════════════════════════
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3@sha256:85666e7fde7e253f1c6d978f9a961245df4c9cdb7677e1866d9bb28e8f9ee41d
    container_name: nginx-exporter
    restart: unless-stopped
    logging: *default-logging
    command:
      - '--nginx.scrape-uri=http://nginx:80/nginx_status'
    depends_on:
      - nginx
    networks:
      - infrastructure

  # ═════════════════════════════════════════════════════════════════════════════
  # Monitoring: Node Exporter (Host System Metrics)
  # ═════════════════════════════════════════════════════════════════════════════
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    restart: unless-stopped
    logging: *default-logging
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - infrastructure

# ═════════════════════════════════════════════════════════════════════════════
  # Plex Media Server
  # ═════════════════════════════════════════════════════════════════════════════
  plex:
    # Pinned by digest 2026-05-17 (was :latest). Bump deliberately every few
    # months — Plex refuses very old servers. To update: pull a new
    # plexinc/pms-docker tag, test, then replace this digest.
    # 2026-10-18: bumped to 1.43.4.10903 after the incident below. Must stay
    # >= 1.43.3.10861 (fixes CompanionProxy SSRF + network-writable
    # transcoder prefs, CVE-2026-96652/96656), which was exploited here.
    # 2026-11-01: 1.43.5.11079 (= latest on that date).
    image: plexinc/pms-docker:1.43.5.11079-b3b13e506@sha256:6d778d41daae68f89115aa87a44ae14a96b23e71a2093da173b5a9aac4091336
    container_name: plex
    restart: unless-stopped
    logging: *default-logging
    environment:
      - TZ=America/New_York
      - PLEX_CLAIM=${PLEX_CLAIM:-}
      # Do NOT add the docker network (172.24.0.0/16) here: nginx proxies all
      # public videos.markcheli.com traffic from that subnet, so trusting it
      # made the internet "LAN". (Only applies on first run; the live value is
      # allowedNetworks in Preferences.xml — keep the two in sync.)
      - ALLOWED_NETWORKS=192.168.1.0/24
    ports:
      - "32400:32400"      # primary Plex API (nginx proxies videos.markcheli.com -> here)
      - "1900:1900/udp"    # DLNA/SSDP discovery (LAN)
      - "32469:32469"      # Plex DLNA server
      # NOTE: do NOT host-publish 5353/udp — it collides with the host
      # avahi-daemon (mDNS). On a clean boot Docker won the port race; after
      # a mid-life dockerd restart (e.g. the 2026-05-17 Docker 29 upgrade)
      # avahi already held 5353 -> plex exit 128 -> nginx hard-failed its
      # config test on the plex upstream -> full site outage. Plex needs no
      # host-side Bonjour; remote access is via Cloudflare -> nginx -> 32400.
    volumes:
      - plex_config:/config
      - /storage/media:/data:ro
    networks:
      - infrastructure

  # ═════════════════════════════════════════════════════════════════════════════
  # Tallied (Personal Finance Dashboard)
  # Image published from: github.com/mcheli/tallied
  # ═════════════════════════════════════════════════════════════════════════════
  tallied-db:
    image: *postgres16-image
    container_name: tallied-db
    restart: unless-stopped
    logging: *default-logging
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/data/server.crt
      -c ssl_key_file=/var/lib/postgresql/data/server.key
      -c hba_file=/etc/postgresql/pg_hba.conf
    environment:
      - POSTGRES_USER=tallied
      - POSTGRES_PASSWORD=${TALLIED_DB_PASSWORD}
      - POSTGRES_DB=tallied
    volumes:
      - tallied_db_data:/var/lib/postgresql/data
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./docker/postgres/init-ssl.sh:/docker-entrypoint-initdb.d/init-ssl.sh:ro
    ports:
      - "5432:5432"
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallied -d tallied"]
      interval: 10s
      timeout: 5s
      retries: 5

  tallied:
    image: ghcr.io/mcheli/tallied:latest
    container_name: tallied
    restart: unless-stopped
    logging: *default-logging
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      tallied-db:
        condition: service_healthy
    env_file: .env
    environment:
      - APP_ROLE=web
      - DATABASE_URL=postgresql://tallied_app:${TALLIED_APP_DB_PASSWORD}@tallied-db:5432/tallied
      - FINANCE_DATABASE_URL=postgresql://tallied_app:${TALLIED_APP_DB_PASSWORD}@tallied-db:5432/tallied
      - FINANCE_BASE_URL=https://money.markcheli.com
      - FINANCE_DEV_MODE=false
      - FINANCE_CREDENTIAL_KEY=${TALLIED_CREDENTIAL_KEY}
      - FINANCE_DEMO_URL=https://money-demo.markcheli.com
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  tallied-scheduler:
    image: ghcr.io/mcheli/tallied:latest
    container_name: tallied-scheduler
    restart: unless-stopped
    logging: *default-logging
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      tallied-db:
        condition: service_healthy
      tallied:
        condition: service_healthy
    env_file: .env
    command: ["python", "-m", "app.scheduler"]
    environment:
      - APP_ROLE=scheduler
      - DATABASE_URL=postgresql://tallied_app:${TALLIED_APP_DB_PASSWORD}@tallied-db:5432/tallied
      - FINANCE_DATABASE_URL=postgresql://tallied_app:${TALLIED_APP_DB_PASSWORD}@tallied-db:5432/tallied
      - FINANCE_BASE_URL=https://money.markcheli.com
      - FINANCE_DEV_MODE=false
      - FINANCE_CREDENTIAL_KEY=${TALLIED_CREDENTIAL_KEY}
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD-SHELL", "grep -q python /proc/1/comm"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Tallied public demo (money-demo.markcheli.com): the same image in demo mode on its OWN
  # database holding only the Claudius Banks seed; read-only, reseeded on every start (cron
  # restarts it nightly). Never give it env_file: .env or the production database: startup
  # refuses AI/Google secrets and any database with real users.
  tallied-demo-db:
    image: *postgres16-image
    container_name: tallied-demo-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_USER=tallied_demo
      - POSTGRES_PASSWORD=${TALLIED_DEMO_DB_PASSWORD}
      - POSTGRES_DB=tallied_demo
    volumes:
      - tallied_demo_db_data:/var/lib/postgresql/data
    networks:
      - tallied-demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallied_demo -d tallied_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  tallied-demo:
    image: ghcr.io/mcheli/tallied:latest
    container_name: tallied-demo
    restart: unless-stopped
    logging: *default-logging
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      tallied-demo-db:
        condition: service_healthy
    environment:
      - APP_ROLE=web
      - DATABASE_URL=postgresql://tallied_demo:${TALLIED_DEMO_DB_PASSWORD}@tallied-demo-db:5432/tallied_demo
      - FINANCE_DATABASE_URL=postgresql://tallied_demo:${TALLIED_DEMO_DB_PASSWORD}@tallied-demo-db:5432/tallied_demo
      - FINANCE_DEMO_MODE=true
      - FINANCE_DEV_MODE=false
      - FINANCE_BASE_URL=https://money-demo.markcheli.com
      - FINANCE_CORS_ORIGINS=["https://money-demo.markcheli.com"]
      - FINANCE_SECRET_KEY=${TALLIED_DEMO_SECRET_KEY}
      - FINANCE_API_KEY_PEPPER=${TALLIED_DEMO_API_KEY_PEPPER}
      - FINANCE_CREDENTIAL_KEY=${TALLIED_DEMO_CREDENTIAL_KEY}
    networks:
      - infrastructure
      - tallied-demo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ═════════════════════════════════════════════════════════════════════════════
  # Tasks (Cycle-based Todo App)
  # Image published from: github.com/mcheli/tasks
  # ═════════════════════════════════════════════════════════════════════════════
