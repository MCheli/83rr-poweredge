      tasks-db:
        condition: service_healthy
    env_file: .env
    environment:
      - TASKS_ENV=${TASKS_ENV}
      - TASKS_ENABLE_DOCS=${TASKS_ENABLE_DOCS}
      - TASKS_DATABASE_URL=${TASKS_DATABASE_URL}
      - TASKS_JWT_SECRET=${TASKS_JWT_SECRET}
      - TASKS_COOKIE_SECURE=${TASKS_COOKIE_SECURE}
      - TASKS_ALLOWED_ORIGINS=${TASKS_ALLOWED_ORIGINS}
      - TASKS_GOOGLE_CLIENT_ID=${TASKS_GOOGLE_CLIENT_ID}
      - TASKS_GOOGLE_CLIENT_SECRET=${TASKS_GOOGLE_CLIENT_SECRET}
      - TASKS_GOOGLE_REDIRECT_URI=${TASKS_GOOGLE_REDIRECT_URI}
      - TASKS_API_KEY_PEPPER=${TASKS_API_KEY_PEPPER}
      - TASKS_TEST_USER_EMAIL=${TASKS_TEST_USER_EMAIL}
      - TASKS_TEST_USER_PASSWORD=${TASKS_TEST_USER_PASSWORD}
      - TASKS_DEMO_URL=https://tasks-demo.markcheli.com
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Tasks public demo (tasks-demo.markcheli.com): the same image in demo mode, read-only, on its
  # own database holding only the made-up Claudius Banks seed (rebuilt on every start; cron
  # restarts it nightly). Never give it env_file: .env or the production database: startup
  # refuses Google/test-user secrets and any database with real users.
  tasks-demo-db:
    image: *postgres16-image
    container_name: tasks-demo-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_USER=tasks_demo
      - POSTGRES_PASSWORD=${TASKS_DEMO_DB_PASSWORD}
      - POSTGRES_DB=tasks_demo
    volumes:
      - tasks_demo_db_data:/var/lib/postgresql/data
    networks:
      - tasks-demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks_demo -d tasks_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  tasks-demo:
    image: ghcr.io/mcheli/tasks:latest
    container_name: tasks-demo
    restart: unless-stopped
    logging: *default-logging
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      tasks-demo-db:
        condition: service_healthy
    environment:
      - TASKS_ENV=production
      - TASKS_ENABLE_DOCS=true
      - TASKS_DEMO_MODE=true
      - TASKS_DATABASE_URL=postgresql+asyncpg://tasks_demo:${TASKS_DEMO_DB_PASSWORD}@tasks-demo-db:5432/tasks_demo
      - TASKS_JWT_SECRET=${TASKS_DEMO_JWT_SECRET}
      - TASKS_API_KEY_PEPPER=${TASKS_DEMO_API_KEY_PEPPER}
      - TASKS_COOKIE_SECURE=true
      - TASKS_ALLOWED_ORIGINS=https://tasks-demo.markcheli.com
    networks:
      - infrastructure
      - tasks-demo
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ═════════════════════════════════════════════════════════════════════════════
  # Daily Report (thermal-printer report generator)
  # Image published from: github.com/MCheli/daily-report
  # ═════════════════════════════════════════════════════════════════════════════
  daily-report:
    image: ghcr.io/mcheli/daily-report:latest
    container_name: daily-report
    restart: unless-stopped
    logging: *default-logging
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    env_file: .env
    environment:
      - TZ=America/New_York
      - REPORT_TIMES=05:00
      - PROM_URL=http://prometheus:9090
      - DAILY_REPORT_PORT=8080
      - ANTHROPIC_API_KEY=${DAILY_REPORT_ANTHROPIC_API_KEY}
      - TALLIED_API_KEY=${TALLIED_API_KEY}
      - TASKS_API_KEY=${TASKS_API_KEY}
      - HOME_ASSISTANT_TOKEN=${HOME_ASSISTANT_TOKEN}
      - CALENDAR_ICS_URL=${CALENDAR_ICS_URL}
      - DAILY_REPORT_API_TOKEN=${DAILY_REPORT_API_TOKEN}
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ═════════════════════════════════════════════════════════════════════════════
  # Uptime Kuma (status page + uptime monitor)
  # Public at status.markcheli.com — needs to be reachable when other things
  # are down. Polls all public + LAN endpoints itself; its alert destination
  # (the self-hosted ntfy below) is configured via the in-app Settings UI.
  # ═════════════════════════════════════════════════════════════════════════════
  uptime-kuma:
    # 2.x pinned by digest 2026-10-31 (was :1, Node 18 EOL, no fix for
    # CVE-2026-111497 Brotli). This digest runs Node 22.23.4. 1.x -> 2.x
    # migrates the SQLite DB one-way: back up 83rr-poweredge_uptime_kuma_data
    # before the first start. Not watchtower-managed; bump deliberately.
    # 2026-11-01: 2.5.9-slim. Slim drops the bundled Chromium (real-browser
    # monitors) and embedded MariaDB; we use neither (http/docker/gamedig
    # monitors on SQLite), and Chromium was most of the image's CVEs. Adding a
    # "Real Browser" monitor later means going back to the full image.
    image: louislam/uptime-kuma:2.5.9-slim@sha256:c41c46667c116066ad252b4887e1c4c66cca8891ca17f3161c1d16540645d1cc
    container_name: uptime-kuma
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - uptime_kuma_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro  # for Docker Container monitor type
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD", "node", "extra/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ═════════════════════════════════════════════════════════════════════════════
  # ntfy (push notifications for homelab alerts)
  # Public at ntfy.markcheli.com (Cloudflare-proxied) so phones can subscribe.
  # Auth is deny-all: OpenSearch alerting and Uptime Kuma publish to topic
  # "homelab" over the infrastructure network with the write-only "alerts"
  # user's token (NTFY_PUBLISH_TOKEN in .env); phones log in as the read-only
  # "mark" user. Users/tokens live in ntfy_data (user.db), not in this repo.
  # Replaced SendGrid on 2026-10-31 (free plan out of credits). Setup and
  # message format: infrastructure/opensearch/config/alerting/README.md.
  # ═════════════════════════════════════════════════════════════════════════════
  ntfy:
    # v2.36.0 (2026-11-01, was v2.11.0 from 2024-05). server.yml needed no
    # changes. The upgrade migrates cache.db/user.db: to roll back, restore the
    # ntfy_data tarball (v2.11 can't read the newer schema).
    image: binwiederhier/ntfy:v2.36.0@sha256:fb48c413eb11d50339962b5d62cddce0f800e7f77c626d638a7c20cb7e9c4465
    container_name: ntfy
    command: serve
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./infrastructure/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy_data:/var/lib/ntfy
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/v1/health | grep -q '\"healthy\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ═════════════════════════════════════════════════════════════════════════════
  # Energy Monitor (panel-tool — circuit breaker → CT channel mapper)
  # Image published from: github.com/MCheli/energy-monitor
  # LAN-only (energy.ops.markcheli.com); ships without auth — keep behind
  # the *.ops nginx allowlist. ESPHome / HA URLs are configured in-app.
  # ═════════════════════════════════════════════════════════════════════════════
  energy-monitor-db:
    image: *postgres16-image
    container_name: energy-monitor-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_USER=panel_tool
      - POSTGRES_PASSWORD=${ENERGY_MONITOR_DB_PASSWORD}
      - POSTGRES_DB=panel_tool
    volumes:
      - energy_monitor_db_data:/var/lib/postgresql/data
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel_tool"]
      interval: 10s
      timeout: 5s
      retries: 5

  energy-monitor:
    image: ghcr.io/mcheli/panel-tool:latest
    container_name: energy-monitor
    restart: unless-stopped
    logging: *default-logging
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      energy-monitor-db:
        condition: service_healthy
    env_file: .env
    environment:
      # Explicit +psycopg2: SQLAlchemy 2.1 made psycopg (v3) the default for
      # postgresql://, and the image only ships psycopg2-binary.
      - DATABASE_URL=postgresql+psycopg2://panel_tool:${ENERGY_MONITOR_DB_PASSWORD}@energy-monitor-db:5432/panel_tool
      - SECRET_KEY=${ENERGY_MONITOR_SECRET_KEY}
      - PANEL_TOOL_DATA_DIR=/data
    volumes:
      - energy_monitor_data:/data
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ═════════════════════════════════════════════════════════════════════════════
  # Dependency-Track v5 (CVE tracking for what's actually running)
  # LAN-only at deptrack.ops.markcheli.com; nginx proxies / -> frontend and
  # /api -> apiserver. No host ports. scripts/sbom-scan.sh uploads a Syft SBOM
  # of every running container nightly; new HIGH/CRITICAL findings go to ntfy.
  # Images are pinned by digest and NOT watchtower-managed: bump deliberately
  # (schema migrations are one-way, back up deptrack-db first).
  # Docs + first boot: docs/dependency-track.md
  # ═════════════════════════════════════════════════════════════════════════════
  deptrack-db:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    container_name: deptrack-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_USER=dtrack
      - POSTGRES_PASSWORD=${DEPTRACK_DB_PASSWORD:?set DEPTRACK_DB_PASSWORD in .env}
      - POSTGRES_DB=dtrack
    volumes:
      - deptrack_db_data:/var/lib/postgresql/data
    networks:
      - deptrack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtrack -d dtrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  deptrack-apiserver:
    image: ghcr.io/dependencytrack/apiserver:5.2.1@sha256:a7ce7a42928c6c03e94e8255e2ee871f5268f55b638a69729cae7afc47ef43b8
    container_name: deptrack-apiserver
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      deptrack-db:
        condition: service_healthy
    environment:
      - DT_DATASOURCE_URL=jdbc:postgresql://deptrack-db:5432/dtrack
      - DT_DATASOURCE_USERNAME=dtrack
      - DT_DATASOURCE_PASSWORD=${DEPTRACK_DB_PASSWORD:?set DEPTRACK_DB_PASSWORD in .env}
      - DT_TELEMETRY_SUBMISSION_DEFAULT_ENABLED=false
      # Outbound allowlist: the internet (vuln mirrors) plus the ntfy container
      # for alerts. Default is external,private, which would let a webhook
      # reach every service on the docker network.
      - DT_OUTBOUND_ALLOWED_DESTINATIONS=external,ntfy
    # JVM heap = 80% of this limit (image default MaxRAMPercentage=80), ~4.8 GB.
    deploy:
      resources:
        limits:
          memory: 6g
    volumes:
      # HOME=/data: holds the secret-management KEK keyset
      # (.dependency-track/keys/), without which secrets stored in the DB
      # (the ntfy token) can't be decrypted. Backed up by backup.sh.
      - deptrack_data:/data
    networks:
      - infrastructure
      - deptrack
    healthcheck:
      # Management port 9000 (not proxied). First boot runs migrations.
      test: ["CMD-SHELL", "wget -q -Y off -T 3 -O /dev/null http://127.0.0.1:9000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  deptrack-frontend:
    image: ghcr.io/dependencytrack/frontend:5.2.1@sha256:1c0f63b083af8e89ff4ede5e7ed5cfc4e23ab871fa140ed101e8dc56f53eb51c
    container_name: deptrack-frontend
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Same origin: nginx serves the SPA and proxies /api to the apiserver.
      - API_BASE_URL=https://deptrack.ops.markcheli.com
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ═════════════════════════════════════════════════════════════════════════════
  # Seafile (Dropbox Replacement)
  # 13.0 Docker layout (env-driven config, separate notification server, redis
  # cache). Upgraded 11.0.13 -> 12.0.14 -> 13.0.28 per
  # docs/seafile-upgrade-2026-11.md. Images are pinned by digest and NOT
  # watchtower-managed: majors run one-way DB migrations, so bump deliberately
  # after a backup. SEAFILE_IMAGE / SEAFILE_NOTIFICATION_IMAGE exist only so the
  # runbook can run the intermediate 12.0 hop; leave them unset in .env.
  # ═════════════════════════════════════════════════════════════════════════════
  seafile-db:
    image: mariadb:10.11
    container_name: seafile-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      - MYSQL_ROOT_PASSWORD=${SEAFILE_DB_ROOT_PASSWORD}
      - MYSQL_LOG_CONSOLE=true
    volumes:
      - seafile_db:/var/lib/mysql
    networks:
      - infrastructure

  # Only needed for the 12.0 hop (12.0 seahub still reads CACHES from
  # seahub_settings.py). 13.0 uses seafile-redis. Remove this service in a
  # follow-up once 13.0 has been stable for two weeks (runbook step 6).
  seafile-memcached:
    image: memcached:1.6.45@sha256:aea0d81d101a9b64fe30cf2cf2f96144e284f8e9552bb084a03f4e12e9043bab
    container_name: seafile-memcached
    restart: unless-stopped
    logging: *default-logging
    entrypoint: memcached -m 256
    networks:
      - infrastructure

  seafile-redis:
    image: redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    container_name: seafile-redis
    restart: unless-stopped
    logging: *default-logging
    # Pure cache: no persistence, password because the network is shared.
    command:
      - /bin/sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no
    environment:
      - REDIS_PASSWORD=${SEAFILE_REDIS_PASSWORD:?set SEAFILE_REDIS_PASSWORD in .env}
    networks:
      - infrastructure

  seafile:
    image: ${SEAFILE_IMAGE:-seafileltd/seafile-mc:13.0.28@sha256:b0c90832126bf432db908449f1bb450211e6bbf75a2193bab3399e2a9636eccf}
    container_name: seafile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - seafile-db
      - seafile-memcached
      - seafile-redis
    environment:
      - SEAFILE_MYSQL_DB_HOST=seafile-db
      - SEAFILE_MYSQL_DB_PORT=3306
      - SEAFILE_MYSQL_DB_USER=seafile
      - SEAFILE_MYSQL_DB_PASSWORD=${SEAFILE_DB_PASSWORD:?set SEAFILE_DB_PASSWORD in .env}
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=ccnet_db
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=seafile_db
      - SEAFILE_MYSQL_DB_SEAHUB_DB_NAME=seahub_db
      - TIME_ZONE=Etc/UTC
      # TLS terminates at the edge nginx; protocol here only builds URLs.
      - SEAFILE_SERVER_HOSTNAME=files.markcheli.com
      - SEAFILE_SERVER_PROTOCOL=https
      - SITE_ROOT=/
      - NON_ROOT=false
      - JWT_PRIVATE_KEY=${SEAFILE_JWT_PRIVATE_KEY:?set SEAFILE_JWT_PRIVATE_KEY in .env}
      # File logs under /shared/seafile/logs are tailed by fluent-bit.
      - SEAFILE_LOG_TO_STDOUT=false
      - ENABLE_GO_FILESERVER=true
      # No SeaDoc / AI / metadata server deployed.
      - ENABLE_SEADOC=false
      - ENABLE_SEAFILE_AI=false
      - ENABLE_FACE_RECOGNITION=false
      # 13.0 only (12.0 ignores these and uses seahub_settings.py/seafile.conf)
      - CACHE_PROVIDER=redis
      - REDIS_HOST=seafile-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${SEAFILE_REDIS_PASSWORD:?set SEAFILE_REDIS_PASSWORD in .env}
      - ENABLE_NOTIFICATION_SERVER=true
      - INNER_NOTIFICATION_SERVER_URL=http://seafile-notification:8083
      - NOTIFICATION_SERVER_URL=https://files.markcheli.com/notification
    volumes:
      - /storage/seafile:/shared
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:80/api2/ping/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Real-time sync notifications for desktop/web clients (own image since 12.0).
  # Edge nginx routes files.markcheli.com/notification here.
  seafile-notification:
    image: ${SEAFILE_NOTIFICATION_IMAGE:-seafileltd/notification-server:13.0.21@sha256:1cac4101d0f4527ad08c00b5452ceb05d790db95d6c8ab6bbace82429c1e5217}
    container_name: seafile-notification
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - seafile-db
      - seafile
    environment:
      - SEAFILE_MYSQL_DB_HOST=seafile-db
      - SEAFILE_MYSQL_DB_PORT=3306
      - SEAFILE_MYSQL_DB_USER=seafile
      - SEAFILE_MYSQL_DB_PASSWORD=${SEAFILE_DB_PASSWORD:?set SEAFILE_DB_PASSWORD in .env}
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=ccnet_db
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=seafile_db
      - JWT_PRIVATE_KEY=${SEAFILE_JWT_PRIVATE_KEY:?set SEAFILE_JWT_PRIVATE_KEY in .env}
      - SEAFILE_LOG_TO_STDOUT=true
      - NOTIFICATION_SERVER_LOG_LEVEL=info
    networks:
      - infrastructure

  # ═════════════════════════════════════════════════════════════════════════════
  # Voice AI Services (LAN-only, for HeyClawy ESP32 devices)
  # Consumers reach them over the LAN by host IP + port: the HeyClawy firmware
  # (SECRETS_TTS_HOST/PORT, SECRETS_STT_HOST/PORT) and Home Assistant (edge-tts).
  # Published on LOCAL_IP (the server's LAN address, from .env) instead of
  # 0.0.0.0, so they no longer listen on IPv6 ([::]) or other interfaces. No
  # auth on either: never port-forward 5050/5051 on the router.
  # ═════════════════════════════════════════════════════════════════════════════
  edge-tts:
    # Pinned by digest 2026-05-17 (was :latest) — 3rd-party, auto-pulled.
    image: travisvn/openai-edge-tts@sha256:af8df8fb39719623cb6c3dbcba87ab65813030d97e20ae436d3161a53d41d72a
    container_name: edge-tts
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${LOCAL_IP:?set LOCAL_IP in .env}:5050:5050"
    environment:
      - DEFAULT_VOICE=en-US-AndrewNeural
      - DEFAULT_LANGUAGE=en-US
      - REQUIRE_API_KEY=false
    networks:
      - voice-services
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/v1/models')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  faster-whisper:
    # Pinned by digest 2026-05-17 (was :latest-cuda) — 3rd-party, auto-pulled.
    image: fedirz/faster-whisper-server@sha256:0b64050ad0b9244745746b652473ee42a8d5454d501877a252c3e65f631ffc99
    container_name: faster-whisper
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${LOCAL_IP:?set LOCAL_IP in .env}:5051:8000"
    environment:
      - WHISPER__MODEL=Systran/faster-whisper-small
      - WHISPER__DEVICE=cpu
      - WHISPER__COMPUTE_TYPE=int8
    networks:
      - voice-services
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ═════════════════════════════════════════════════════════════════════════════
  # Watchtower (Automatic Container Updates)
  # Monitors ghcr.io images and auto-deploys when new versions are pushed
  # ═════════════════════════════════════════════════════════════════════════════
  watchtower:
    # containrrr/watchtower is abandoned and too old for the Docker 29 API
    # (min API 1.40); migrated to the maintained nicholas-fedor fork 2026-08-05.
    # Pinned 2026-11-01 (was :latest = 1.20.3). The fork tags images without
    # the "v" its GitHub releases use. 1.23.2 checks notification URLs at
    # startup; logger:// below is valid.
    image: ghcr.io/nicholas-fedor/watchtower:1.23.2@sha256:62fb91130ddb493f869cad7e198fa260dd16c5da293ed092cbd5d8781566f7a6
    container_name: watchtower
    restart: unless-stopped
    logging: *default-logging
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=true
      # Rolling restart disabled: the nicholas-fedor fork rejects it when a
      # dependency chain exists (tallied-scheduler -> tallied-db). Without it,
      # watchtower honors depends_on ordering when recreating containers.
      - WATCHTOWER_ROLLING_RESTART=false
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=logger://
      - WATCHTOWER_LIFECYCLE_HOOKS=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/mcheli/.docker/config.json:/config.json:ro
    networks:
      - infrastructure

# ═════════════════════════════════════════════════════════════════════════════
# Networks
# ═════════════════════════════════════════════════════════════════════════════
networks:
  infrastructure:
    driver: bridge
  nginx-openclaw:
    # Dedicated proxy network: only NGINX and OpenClaw
    # Created by infrastructure/openclaw/docker-compose.yml
    external: true
    name: openclaw_nginx-openclaw
  voice-services:
    # LAN-only network for voice AI services (EdgeTTS, faster-whisper)
    driver: bridge
  tallied-demo:
    # Only the Tallied demo app and its database; the demo can't reach tallied-db
    internal: true
  tasks-demo:
    # Only the Tasks demo app and its database; the demo can't reach tasks-db
    internal: true
  deptrack:
    # Only the Dependency-Track apiserver and its database
    internal: true

# ═════════════════════════════════════════════════════════════════════════════
# Volumes
# ═════════════════════════════════════════════════════════════════════════════
volumes:
  opensearch_data:
  fluent_bit_data:
  minecraft_data_local:
  prometheus_data:
  grafana_data:
  plex_config:
  tallied_db_data:
  tallied_demo_db_data:
  tasks_db_data:
  tasks_demo_db_data:
  energy_monitor_db_data:
  energy_monitor_data:
  deptrack_db_data:
  deptrack_data:
  uptime_kuma_data:
  ntfy_data:
  seafile_db:
  # ASA — Docker-managed (lives on / since steamcmd is fussy about bind mounts)
  asa_server_files:
  asa_steam:
  asa_steamcmd:
  asa_cluster_shared: